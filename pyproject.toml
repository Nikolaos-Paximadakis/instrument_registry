[project]
name = "instrument-registry"
version = "0.1.0"
description = "Shared reference data for real-world financial instruments (ISIN) and legal entities (LEI), for stock-related projects to resolve title/company identity against instead of fuzzy string matching."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.27",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
